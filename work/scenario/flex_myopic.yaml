run:
  flex_tag: flex-myopic
  prefix: scenario
  name: flex-myopic

foresight: myopic

scenario:
  planning_horizons:
  - 2030
  - 2040
  - 2045

electricity:
  extendable_carriers:
    Generator: [ solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT ]
    StorageUnit: [] # battery, H2
    Store: [battery, H2]
    Link: [] # H2 pipeline
  conventional_carriers: [nuclear, oil, OCGT, CCGT, coal, lignite, geothermal]

lines:
  dynamic_line_rating:
    activate: true
    cutout: europe-2019-sarah3-era5
    correction_factor: 0.95
    max_voltage_difference: false
    max_line_rating: false

sector:
  heat_pump_enable: true
  dsm_enable: true

  chp:
    enable: true
    fuel:
      #- solid biomass # For solid biomass, CHP with and without CC are added
      - gas # For all other fuels the same techno economic data from gas CHP is taken


solving:
  agg_p_nom_limits:
    agg_offwind: false
    include_existing: true
    file: data/agg_p_nom_minmax.csv

    fixed_demand:
      activate: true  # Set to false to disable fixed demand
      file: data/demand_values.csv  # Path to your demand values CSV file

  constraints:
    CCL: true
    CLL: true
    EQ: false
    BAU: false
    SAFE: false